name: Release

# Two kinds of tag are released from this repository:
#
#   v1.2.3                      the SDK itself (the root module)
#   stickybucket/redis/v1.2.3   an optional adapter (a nested module)
#
# The prefixed form is not a convention we chose: the Go module proxy resolves a
# module in subdirectory sub/dir only from tags named sub/dir/vX.Y.Z. It also
# means adapters version independently of the SDK.
on:
  push:
    tags:
      - 'v*'
      - '**/v*'

jobs:
  release:
    name: Create Release
    if: ${{ !contains(github.ref_name, '/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Run tests before release
        run: go test -v -race ./...

      # Adapters build against this tree through a replace directive, so an SDK
      # release that breaks one is caught here rather than by whoever tags the
      # adapter next.
      - name: Test adapters against this revision
        run: go test -race ./...
        working-directory: stickybucket/redis

      - name: Generate release notes
        id: release_notes
        run: |
          TAG=${{ github.ref_name }}
          PREV_TAG=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %h: %s" --reverse)
          else
            CHANGELOG=$(git log $PREV_TAG..$TAG --pretty=format:"- %h: %s" --reverse)
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            ## Changes in ${{ github.ref_name }}
            
            ${{ steps.release_notes.outputs.changelog }}
            
            ### Testing
            - ✅ All tests passed
            - ✅ Race detector passed
            - ✅ Linting passed
            - ✅ Security scans passed
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-adapter:
    name: Release adapter module
    if: ${{ contains(github.ref_name, '/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      # stickybucket/redis/v0.1.0 -> stickybucket/redis
      - name: Resolve module directory
        id: mod
        run: |
          DIR="${GITHUB_REF_NAME%/*}"
          if [ ! -f "$DIR/go.mod" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name a module directory ($DIR/go.mod not found)"
            exit 1
          fi
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Run tests before release
        run: go test -v -race ./...
        working-directory: ${{ steps.mod.outputs.dir }}

      # The replace directive points the module at this working tree, and
      # consumers ignore it — so day to day nothing verifies that the SDK
      # version in `require` was ever published. Drop the replace and build:
      # this is the only check that the module works for anyone else.
      - name: Verify the module resolves without the local replace
        run: |
          go mod edit -dropreplace github.com/growthbook/growthbook-golang
          go build ./...
        working-directory: ${{ steps.mod.outputs.dir }}

      - name: Generate release notes
        id: release_notes
        run: |
          DIR="${{ steps.mod.outputs.dir }}"
          # The previous release of this module, not of the SDK.
          PREV_TAG=$(git tag -l "$DIR/v*" --sort=-v:refname | sed -n 2p)

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %h: %s" --reverse -- "$DIR")
          else
            CHANGELOG=$(git log "$PREV_TAG..$GITHUB_REF_NAME" --pretty=format:"- %h: %s" --reverse -- "$DIR")
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Optional adapter module `github.com/growthbook/growthbook-golang/${{ steps.mod.outputs.dir }}`.

            ```
            go get github.com/growthbook/growthbook-golang/${{ steps.mod.outputs.dir }}@${{ github.ref_name }}
            ```

            ## Changes

            ${{ steps.release_notes.outputs.changelog }}

            ### Testing
            - ✅ All tests passed
            - ✅ Race detector passed
            - ✅ Resolves without the development replace directive
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
